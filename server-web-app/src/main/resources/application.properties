spring.application.name=LostAndFound

# ================== MySQL ==================
spring.datasource.url=jdbc:mysql://localhost:3306/LostAndFoundModern?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=server
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================== Flyway ==================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=false

# ================== JPA ==================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ================== Logging ==================
logging.file.name=logs/laf.log
logging.level.root=WARN
logging.level.com.fruit.serverwebapp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

logging.logback.rollingpolicy.file-name-pattern=logs/laf.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.max-file-size=10MB